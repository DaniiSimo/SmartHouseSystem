# Настройки mqtt брокера
mqtt:
  host: m8.wqtt.ru
  port: 18992
  username: ''
  password: ''
  keepalive: 20
  topicMicrophone: audio/topic
# Настройки микрофона
microphone:
  #Индекс микрофона
  deviceIndex: 1
  # Частота
  rate: 16000
  # Чувствительность
  energy: 150
  # Порог паузы
  pause: 0.5
  # Максимальное время записи
  phrase: 20
